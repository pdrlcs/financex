<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financex — Dashboard</title>

  <!-- Favicon (marca provisória: quadrado azul + ticks) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%233066BE'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 14l4-4 4 3 7-7'/%3E%3Cpath d='M4 20l4-3 4 2 7-6' opacity='0.55'/%3E%3C/g%3E%3C/svg%3E" />

  <!-- Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tokens + layout -->
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/layout.css" />

  <!-- Chart.js (UMD, auto-registra controllers) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>

  <!-- React + Babel (pinned + integrity) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- ============================================================
       Ordem de carregamento (browser-Babel): tudo roda antes do
       render, disparado só no último script (src/app.jsx).
       Sequência: lib → ui → layout → charts → features → app.
       ============================================================ -->

  <!-- Dados mock (plain JS → window.FX) -->
  <script src="src/lib/data.js"></script>

  <!-- Componentes de UI compartilhados -->
  <script type="text/babel" src="src/components/ui/icons.jsx"></script>
  <script type="text/babel" src="src/components/ui/modal.jsx"></script>
  <script type="text/babel" src="src/components/ui/toast.jsx"></script>
  <script type="text/babel" src="src/components/ui/confirm-dialog.jsx"></script>
  <script type="text/babel" src="src/components/ui/screen.jsx"></script>
  <script type="text/babel" src="src/components/ui/entity-card.jsx"></script>

  <!-- Shell (navbar + sidebar) -->
  <script type="text/babel" src="src/components/layout/shell.jsx"></script>

  <!-- Gráficos -->
  <script type="text/babel" src="src/components/charts/chart-core.jsx"></script>
  <script type="text/babel" src="src/components/charts/chart-types.jsx"></script>
  <script type="text/babel" src="src/components/charts/custom-viz.jsx"></script>

  <!-- Features: Dashboard -->
  <script type="text/babel" src="src/features/dashboard/board-card.jsx"></script>
  <script type="text/babel" src="src/features/dashboard/kpis.jsx"></script>
  <script type="text/babel" src="src/features/dashboard/visao-geral.jsx"></script>
  <script type="text/babel" src="src/features/dashboard/tabs.jsx"></script>
  <script type="text/babel" src="src/features/dashboard/dashboard.jsx"></script>
  <script type="text/babel" src="src/features/dashboard/exclude-tags-modal.jsx"></script>

  <!-- Features: Transações -->
  <script type="text/babel" src="src/features/transacoes/transacao-modal.jsx"></script>
  <script type="text/babel" src="src/features/transacoes/transacoes-screen.jsx"></script>

  <!-- Features: Tags / Contas -->
  <script type="text/babel" src="src/features/tags/tag-conta-modal.jsx"></script>
  <script type="text/babel" src="src/features/tags/tags-screen.jsx"></script>
  <script type="text/babel" src="src/features/contas/contas-screen.jsx"></script>

  <!-- App principal (dispara o render) -->
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
