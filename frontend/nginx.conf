# Financex frontend — nginx que serve o SPA estático e atua como
# reverse proxy do backend (PORT_FRONTEND.md, decisão #1).
#
# O front fala sempre por caminho relativo: /api/... . Aqui o /api é
# reescrito para a raiz do backend (que expõe /tags, /contas, /graphs…
# sem prefixo). Assim só a porta do frontend é publicada; o backend fica
# acessível apenas dentro da rede do compose, via este proxy.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip básico para os assets do build
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse proxy: /api/<rota> -> http://backend:8000/<rota>
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: qualquer rota do client-side router cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
