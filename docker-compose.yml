services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financex
      POSTGRES_USER: financex
      POSTGRES_PASSWORD: financex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financex"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # Sem porta publicada no host: o backend só é alcançado pela rede do
    # compose, via o reverse proxy do nginx do frontend (decisão #1).
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn app.app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    # Única porta publicada no host. O nginx serve o SPA e faz proxy de
    # /api -> backend:8000 (ver frontend/nginx.conf).
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
